  <title>Production occupations</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
}

* {
  box-sizing: border-box;
}

.bubble-container {
  width: 100%;
  max-width: 1320px;
  margin: 0;
  padding: 0;
  position: relative;
  font-family: Arial, Helvetica, sans-serif;
  color: #222222;
}

.bubble-title {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 12px 0;
}

.bubble-subtitle {
  font-size: 16px;
  font-weight: 400;
  line-height: 1.45;
  margin: 0 0 26px 0;
  max-width: 1100px;
}

.bubble-y-label {
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 8px 0;
}

.bubble-chart {
  position: relative;
  width: 100%;
  margin: 0;
  padding: 0;
}

.bubble-chart svg {
  display: block;
  width: 100%;
  height: auto;
}

.metro-bubble {
  cursor: pointer;
  transition: opacity 0.15s ease;
  outline: none;
}

.metro-bubble:focus-visible {
  stroke: #0074CC;
  stroke-width: 3;
}

.metro-label {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 18px;
  fill: #222222;
  pointer-events: none;
}

.axis-text {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 17px;
  fill: #222222;
}

.axis-line {
  stroke: #222222;
  stroke-width: 2;
}

.bubble-x-label {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  margin: 0 0 10px 0;
}

.bubble-tooltip {
  position: absolute;
  z-index: 100;
  pointer-events: none;
  background: #ffffff;
  color: #222222;
  border: 1px solid #dddddd;
  border-radius: 4px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  padding: 12px 14px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  max-width: 290px;
  display: none;
}

.tooltip-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
}

.tooltip-row {
  margin-top: 4px;
}

@media (max-width: 700px) {
  .bubble-title {
    font-size: 18px;
  }

  .bubble-subtitle {
    font-size: 13px;
  }

  .bubble-y-label {
    font-size: 13px;
  }

  .bubble-x-label {
    font-size: 13px;
  }
}
</style>
</head>

      <div class="bubble-x-label">Credentials produced as a percentage of annual job openings</div>
      <div class="bubble-tooltip" role="status" aria-live="polite"></div>
    </div>
    <script>
(function() {

  const container = document.querySelector(".bubble-container");
  const bubbles = Array.from(
    document.querySelectorAll(".metro-bubble")
  );
  const tooltip = document.querySelector(".bubble-tooltip");

  function moveTooltip(event) {

    const rect = container.getBoundingClientRect();

    let x = event.clientX - rect.left + 16;
    let y = event.clientY - rect.top + 12;

    const w = tooltip.offsetWidth;
    const h = tooltip.offsetHeight;

    if (x + w > rect.width) {
      x = event.clientX - rect.left - w - 16;
    }

    if (y + h > rect.height) {
      y = event.clientY - rect.top - h - 12;
    }

    tooltip.style.left = Math.max(0, x) + "px";
    tooltip.style.top = Math.max(0, y) + "px";
  }

  function showTooltip(bubble, event) {

    bubbles.forEach(function(b) {
      b.style.opacity = (b === bubble) ? "1" : "0.18";
    });

    tooltip.replaceChildren();

    const title = document.createElement("div");
    title.className = "tooltip-title";
    title.textContent = bubble.dataset.metro;

    tooltip.appendChild(title);

    const rows = [
      ["Annual job openings", bubble.dataset.openings],
      ["Openings per 1,000 workers", bubble.dataset.jobs],
      ["Credentials as % of openings", bubble.dataset.credential]
    ];

    rows.forEach(function(item) {

      const row = document.createElement("div");
      row.className = "tooltip-row";

      const label = document.createElement("strong");
      label.textContent = item[0] + ": ";

      row.appendChild(label);
      row.appendChild(document.createTextNode(item[1]));

      tooltip.appendChild(row);
    });

    tooltip.style.display = "block";

    if (event && event.clientX !== undefined) {
      moveTooltip(event);
    } else {
      const r = bubble.getBoundingClientRect();

      moveTooltip({
        clientX: r.left + r.width / 2,
        clientY: r.top + r.height / 2
      });
    }
  }

  function resetBubbles() {

    bubbles.forEach(function(b) {
      b.style.opacity = "0.8";
    });

    tooltip.style.display = "none";
  }

  bubbles.forEach(function(bubble) {

    bubble.addEventListener("mouseenter", function(e) {
      showTooltip(bubble, e);
    });

    bubble.addEventListener("mousemove", moveTooltip);

    bubble.addEventListener("mouseleave", resetBubbles);

    bubble.addEventListener("focus", function() {
      showTooltip(bubble, null);
    });

    bubble.addEventListener("blur", resetBubbles);

    bubble.addEventListener("click", function(e) {
      e.stopPropagation();
      showTooltip(bubble, e);
    });
  });

  container.addEventListener("click", function(e) {
    if (!e.target.classList.contains("metro-bubble")) {
      resetBubbles();
    }
  });

})();
</script>
